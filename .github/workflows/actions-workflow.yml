name: first-workflow
on: push
jobs:
    using_reusable:
        uses: sahil4010/actions-pipeline/.github/workflows/reusable.yml@test
        with:
            version: 3.12

    job2:
        runs-on: self-hosted
        needs: using_reusable
        steps:
        -   name: get code
            uses: actions/checkout@v4

        -   name: dockerize
            run: |
                docker network create -d bridge two-tier
                docker build -t actions-pipeline .

                docker run -d \
                    --name mysql \
                    -v mysql-data:/var/lib/mysql \
                    --network=two-tier \
                    -e MYSQL_DATABASE=mydb \
                    -e MYSQL_ROOT_PASSWORD=admin \
                    -p 3306:3306 \
                    mysql:5.7

                docker run -d \
                    --name flaskapp \
                    --network=two-tier \
                    -e MYSQL_HOST=mysql \
                    -e MYSQL_USER=root \
                    -e MYSQL_PASSWORD=admin \
                    -e MYSQL_DB=mydb \
                    -p 5000:5000 \
                    actions-pipeline:latest

        -   name: create pods
            run: |
                cd k8s
                kubectl creante ns assignment
                kubectl apply -n assignment -f mysql-deployment.yml
                kubectl apply -n assignment -f mysql-configmap.yml
                kubectl apply -n assignment -f mysql-secrets.yml
                kubectl apply -n assignment -f mysql-svc.yml   
                kubectl apply -n assignment -f two-tier-app-deployment.yml
                kubectl apply -n assignment -f two-tier-app-svc.yml                
                kubectl get all -n assignment